info:
  name: /series
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/series"
  body:
    type: json
    data: |-
      {
        "title": "Breaking Bad",
        "seasons": 5,
        "releaseYear": 2008,
        "genreId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
